music_directory    "~/Music"
playlist_directory "~/.mpd/playlists"
db_file            "~/.mpd/database"
log_file           "~/.mpd/log"
pid_file           "~/.mpd/pid"
state_file         "~/.mpd/state"

bind_to_address    "localhost"
port               "6600"

restore_paused     "yes"
auto_update        "yes"
auto_update_depth  "3"

audio_output {
    type    "pulse"
    name    "Pulse / PipeWire Output"
}