set -g default-command /bin/zsh
set -g default-shell /bin/zsh
set-option -g prefix C-v
unbind-key C-b
bind-key C-v send-prefix

# vi key bindings in copy mode
setw -g mode-keys vi

# Use vim-like keys for copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Scroll with C-d / C-u in copy mode (like vim)
bind-key -T copy-mode-vi C-d send-keys -X page-down
bind-key -T copy-mode-vi C-u send-keys -X page-up

# Enter copy mode with Esc or prefix + [
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key [ copy-mode

# Use prefix + C-c to copy to system clipboard (works on Linux with xclip/xsel)
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# Mouse support
set -g mouse on

# Increase scrollback buffer
set -g history-limit 50000

# Use prefix + y to copy current command output to clipboard
bind-key y run-shell -b "tmux capture-pane -pS - | head -n -2 | tail -n +2 | xclip -selection clipboard"

# Use prefix + Y to copy entire pane history to clipboard
bind-key Y run-shell -b "tmux capture-pane -pS - | xclip -selection clipboard"

# Better colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
