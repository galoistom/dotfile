source = $HOME/.config/hypr/dracula_colors.conf

$font = Cascadia Mono
$base = $background
$text = $foreground
$textAlpha = $foregroundRaw
$accentAlpha = $accentRaw

# GENERAL
general {
    hide_cursor = false
    ignore_empty_input= true
}

# BACKGROUND
background {
    monitor =
    # change to the path to your wallpaper
    path = ~/Pictures/lock.jpg
    blur_passes = 0
    color = $base
}

# TIME
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 90
    font_family = $font
    position = 30, 0
    halign = top
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
    color = $text
    font_size = 25
    font_family = $font
    position = 30, -150
    halign = left
    valign = top
}

input-field {
    monitor =
    size = 9%, 3.1%       # 使用百分比宽高，适配不同分辨率的屏幕
    outline_thickness = 2 # 边框粗细

    # 密码掩码圆点设置
    dots_size = 0.26      # 圆点相对于输入框高度的大小
    dots_spacing = 0.64   # 圆点之间的间距
    dots_center = true    # 圆点垂直居中
    dots_rounding = -1    # -1 表示完美的圆形

    rounding = 12         # 输入框圆角半径
    
    # 颜色设置 (支持渐变)
    # 这里的 outer_color 使用了渐变色: 主色 -> 第三色 -> 主色
    outer_color = $accent
    inner_color = $background
    font_color = $text        # 输入文字颜色
    check_color = $accent
    fail_color = $red            # 验证失败颜色

    fade_on_empty = true
    placeholder_text = <i>Password...</i> # 占位符提示文字 (斜体)

    # 保持在底部 10%，与上方的时间形成极大的张力
    position = 0, 10%
    halign = center       # 水平居中
    valign = bottom       # 垂直对齐到底部
}